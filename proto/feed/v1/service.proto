syntax = "proto3";

option go_package = "github.com/Shin-Thant/service-test/internal/pb/feed";

package feed.v1;

service FeedService {
  rpc FindOne (FindOneRequest) returns (FindOneResponse) {}
}

message FindOneRequest {
  int32 id = 1;
}

message FindOneResponse {
  int32 id = 1;
  string name = 2;
}
